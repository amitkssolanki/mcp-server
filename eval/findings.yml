- id: F6
  title: Overlapping buckets presented as additive
  severity: medium
  triage: tool_bug
  scope: fix
  status: verified
  fixed_in: 5fa9bf3
  tools: [revenue_report]
  definition: "METRICS.md: Principles (say whether a breakdown adds up); Counts (orders)"
  summary: >
    revenue_report printed "Total across shown rows: N orders" and returned
    totals.orders for category, seller and payment-method groupings, where
    one order sits in several buckets. Across all categories that "total" is
    97,729 orders. The figure is inflated, and it invites the model to repeat
    it.
  checks: [overlapping-groups-not-additive]
  reports: [01b-before-fixes-full.txt (failing), 02-after-fixes.txt (passing)]
  regression: [P8-revenue-report]

- id: F7
  title: Payment-method revenue double-counts split payments
  severity: high
  triage: tool_bug
  scope: fix
  status: verified
  fixed_in: 5fa9bf3
  tools: [revenue_report]
  definition: "METRICS.md: Money (payment_value)"
  summary: >
    revenue_report(payment_method) credited the whole order total to every
    payment type the order used, so a voucher plus card order counted in full
    twice. Credit card came out R$185,429 high (R$12,534,959 against
    R$12,349,530 collected) and voucher 1.4x high. Decision: this grouping
    reports payment_value.
  checks: [revenue-by-payment-method, revenue-by-payment-method-2018]
  reports: [01b-before-fixes-full.txt (failing), 02-after-fixes.txt (passing)]
  regression: [P8-revenue-report]

