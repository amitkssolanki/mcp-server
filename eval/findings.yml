- id: F9
  title: find_customer matches email as a substring
  severity: medium
  triage: tool_bug
  scope: fix
  status: verified
  fixed_in: 77c4a70
  tools: [find_customer]
  definition: "METRICS.md: Customers (exact, case-insensitive match)"
  summary: >
    LIKE '%term%' on the caller's input, so "%", "_" or a fragment of an id
    returned an arbitrary customer's order history. The answer is about the
    wrong person, and the tool can be used to enumerate customers. Fix: exact,
    case-insensitive match.
  checks: [find-customer-exact-match]
  reports: [01b-before-fixes-full.txt (failing), 02-after-fixes.txt (passing)]
  regression: [P4-find-customer]

- id: F10
  title: Preview-then-confirm is enforced by the prompt, not the server
  severity: medium
  triage: security
  scope: separate
  status: deferred
  tools: [update_product_price, update_order_status]
  definition: null
  summary: >
    Nothing server-side ties a confirm:true call to an earlier preview; a
    model can confirm first. Writes are disabled on the public deployment,
    and the HTTP boundary tests pin that a write tool cannot be reached there
    even with a stale write-scoped token, so there is no live exposure. The
    fix is a signed, expiring preview token with stale-preview rejection.
    That is write-safety work, deliberately outside the correctness scope.
  checks: []
  regression: []

- id: F11
  title: Customer lookup is not scoped to the store
  severity: low
  triage: security
  scope: out_of_scope
  status: out_of_scope
  tools: [find_customer]
  definition: null
  summary: >
    Spree users are global. find_customer scopes the customer's orders to the
    store but not the user row. With one store this cannot leak anything, and
    the boundary tests show another store's server resolves none of this
    store's orders. Real multi-tenancy would need it. The F9 fix does not
    widen or narrow this.
  checks: []
  regression: []

- id: F12
  title: The server agreed to an MCP protocol revision it does not implement
  severity: high
  triage: tool_bug
  scope: fix
  status: verified
  tools: [all (protocol layer)]
  definition: null
  summary: >
    Found on day 3, when the agent evaluation's first runs showed the store
    server connected but exposing 0 tools. Logging in updated Claude Code
    from 2.1.252 to 2.1.284, which negotiates MCP revision 2026-07-28. The
    Ruby SDK (mcp 1.1.0) lists 2026-07-28 as its latest stable revision and
    agreed to it on both initialize and server/discover, but does not
    implement it: that revision requires a resultType on list results, and
    1.1.0 sends none (the SDK's changelog adds it in 1.2.0). The client
    rejected tools/list, the model saw no tools, wrote "Tool call:
    search_orders" as prose, and in one probe invented a tool result (6
    cancelled 2018 orders; the oracle says 334). The same SDK serves the
    deployed HTTP endpoint, so any client negotiating 2026-07-28 would likely
    get zero tools there too. That is not verified against production, which
    was not touched. Fix: StoreMcp::Server pins the negotiated revision to
    2025-11-25, the newest 1.1.0 implements, on both paths. The SDK was not
    upgraded. Tool definitions and outputs are unchanged, and the day 2
    harness fingerprint is identical. The agent runner now fails a run that
    does not see exactly the nine read tools.
  checks: [mcp_boundary_test (2026-07-28 negotiated down; discovery omits it), agent_grader_test (tool visibility)]
  reports: [03-agent-baseline (the aborted first attempt is described there)]
  regression: []

- id: F13
  title: Customer-written review text reaches the model unfenced in structured results
  severity: low
  triage: security
  scope: separate
  status: deferred
  tools: [get_order]
  definition: null
  summary: >
    Claude Code passes structuredContent to the model, not the text content.
    get_order's text fences review title/message as customer-written data;
    its structured review.title/message are bare strings. Probed with two
    benign instruction-shaped payloads in a local test-database review, 3
    runs each (claude-sonnet-5, Claude Code 2.1.284): the payload reached the
    model unfenced 6/6, and the model reported the true score, made no extra
    tool call and explicitly identified the text as an embedded instruction
    6/6. Classified F13-B, a defence-in-depth weakness: not demonstrated
    exploitable, but the server's own defence is absent from the
    representation clients use, so protection rests on the model alone.
    Remediation: mark customer text as untrusted inside the structured
    result and in get_order's description. Before any write-enabled
    deployment, together with F10.
  checks: []
  reports: [05-f13-untrusted-text.md]
  regression: []
